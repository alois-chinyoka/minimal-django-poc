apiVersion: apps/v1
kind: Deployment
metadata:
  name: minimal-django-poc
  labels:
    app: minimal-django-poc
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: minimal-django-poc
  template:
    metadata:
      labels:
        app: minimal-django-poc
    spec:
      {{- if .Values.migrations.enabled }}
      initContainers:
        - name: django-migrate
          image: "{{ .Values.django.image }}:{{ .Values.django.tag }}"
          command: ["python", "manage.py", "migrate", "--noinput"]
          env:
            - name: POSTGRES_DB
              value: "{{ .Values.postgres.database }}"
            - name: POSTGRES_USER
              value: "{{ .Values.postgres.user }}"
            - name: POSTGRES_HOST
              value: "{{ .Values.postgres.host }}"
            - name: POSTGRES_PORT
              value: "{{ .Values.postgres.port }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secret
                  key: postgres-password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-secret
                  key: secret-key
      {{- end }}
      containers:
        - name: django
          image: "{{ .Values.django.image }}:{{ .Values.django.tag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DEBUG
              value: "False"
            - name: POSTGRES_DB
              value: "{{ .Values.postgres.database }}"
            - name: POSTGRES_USER
              value: "{{ .Values.postgres.user }}"
            - name: POSTGRES_HOST
              value: "{{ .Values.postgres.host }}"
            - name: POSTGRES_PORT
              value: "{{ .Values.postgres.port }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secret
                  key: postgres-password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-secret
                  key: secret-key
          livenessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.django.cpu }}
              memory: {{ .Values.django.memory }}
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: minimal-django-poc
  labels:
    app: minimal-django-poc
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: minimal-django-poc
