replicas: 2

django:
  image: 320119139359.dkr.ecr.eu-central-1.amazonaws.com/skillregistry-poc/minimal-django-poc
  tag: "v0.1.0"
  cpu: "250m"
  memory: "256Mi"
  env:
    DEBUG: "False"

postgres:
  host: "postgres.prod.svc.cluster.local"
  port: 5432
  database: "tasks_db_prod"
  user: "postgres"

migrations:
  enabled: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
