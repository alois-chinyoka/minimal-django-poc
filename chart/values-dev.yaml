replicas: 1

django:
  image: 320119139359.dkr.ecr.eu-central-1.amazonaws.com/skillregistry-poc/minimal-django-poc
  tag: latest
  cpu: "100m"
  memory: "128Mi"
  env:
    DEBUG: "False"

postgres:
  host: "postgres.default.svc.cluster.local"
  port: 5432
  database: "tasks_db_dev"
  user: "postgres"

migrations:
  enabled: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
