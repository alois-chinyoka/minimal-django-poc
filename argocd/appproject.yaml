apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: minimal-django-poc
  namespace: argocd
spec:
  sourceRepos:
    - "https://github.com/alois-chinyoka/minimal-django-poc"
  destinations:
    - namespace: dev
      server: https://kubernetes.default.svc
    - namespace: prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
