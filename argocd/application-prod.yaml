apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minimal-django-poc-prod
  namespace: argocd
  finalizers:
    - minimal-django-poc.argoproj.io/resources-finalizer
spec:
  project: minimal-django-poc
  source:
    repoURL: https://github.com/alois-chinyoka/minimal-django-poc
    path: chart
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
