apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minimal-django-poc-dev
  namespace: argocd
  finalizers:
    - minimal-django-poc.argoproj.io/resources-finalizer
spec:
  project: minimal-django-poc
  source:
    repoURL: https://github.com/alois-chinyoka/minimal-django-poc
    path: chart
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
      values: |
        replicas: 1
        django:
          image: 320119139359.dkr.ecr.eu-central-1.amazonaws.com/skillregistry-poc/minimal-django-poc
          tag: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
